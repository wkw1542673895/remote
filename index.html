<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<title>Remote Access</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; color: #333; background: #f0f2f5; min-height: 100vh; padding: 20px; display: flex; justify-content: center; align-items: center; }
  .container { width: 100%; max-width: 600px; }
  h2 { text-align: center; margin-bottom: 24px; font-size: 22px; color: #222; }
  .section { background: #fff; border-radius: 14px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .label { font-size: 13px; color: #888; margin-bottom: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
  .item { margin-bottom: 12px; }
  .item:last-child { margin-bottom: 0; }
  .item strong { font-size: 14px; color: #555; display: block; margin-bottom: 4px; }
  a { color: #0066cc; text-decoration: none; font-size: 15px; word-break: break-all; display: block; padding: 8px 12px; background: #f8f9fa; border-radius: 8px; }
  a:hover { background: #e8f0fe; }
  a.cf { font-size: 13px; color: #888; background: none; padding: 4px 12px; margin-top: 2px; }
  a.cf:hover { color: #0066cc; }
  .time { color: #aaa; font-size: 12px; text-align: center; margin-top: 12px; }
</style>
<script>
const FALLBACK_URLS = {"dashboard": "https://frp-way.com:55918", "terminal": "https://frp-way.com:55918/terminal/", "mobile": "https://frp-way.com:55918/mobile", "mobile_dashboard": "https://frp-way.com:55918/dashboard/mobile", "desktop": "https://frp-way.com:55918/desktop", "files": "https://frp-way.com:55918/files", "dashboard2": "https://frp-way.com:55918/dashboard2", "updated": "2026-08-26 22:12", "cloudflare": "https://patents-rocks-wishing-minimum.trycloudflare.com", "cf_terminal": "https://patents-rocks-wishing-minimum.trycloudflare.com/terminal", "cf_mobile": "https://patents-rocks-wishing-minimum.trycloudflare.com/mobile"};
async function load() {
  let d = FALLBACK_URLS;
  const endpoints = [
    'url.json?cb=' + Date.now(),
    'https://api.github.com/repos/wkw1542673895/remote/contents/url.json'
  ];
  for (const endpoint of endpoints) {
    try {
      const r = await fetch(endpoint, { cache: 'no-store' });
      if (!r.ok) continue;
      let candidate = await r.json();
      if (candidate.content) {
        candidate = JSON.parse(atob(candidate.content.replace(/\n/g, '')));
      }
      if (!candidate.dashboard) {
        continue;
      }
      if (!d.updated || !candidate.updated || candidate.updated >= d.updated) {
        d = candidate;
      }
      break;
    } catch (_) {}
  }
  const set = (id, url) => { const el = document.getElementById(id); if (el && url) { el.href = url; el.textContent = url; } };
  const base = d.dashboard || '';
  const cf = d.cloudflare || '';
  set('dashboard', base);
  set('dashboard2', d.dashboard2 || base + '/dashboard2');
  set('terminal', d.terminal || base + '/terminal/');
  set('desktop', d.desktop || base + '/desktop');
  set('files', d.files || base + '/files');
  set('mobile_dashboard', d.mobile_dashboard || base + '/dashboard/mobile');
  set('mobile', d.mobile || base + '/mobile');
  set('mobile_files', d.files || base + '/files');
  if (cf) {
    document.querySelectorAll('.cf').forEach(el => el.style.display = 'block');
    set('cf_dashboard', cf);
    set('cf_dashboard2', cf + '/dashboard2');
    set('cf_terminal', cf + '/terminal');
    set('cf_desktop', cf + '/desktop');
    set('cf_files', cf + '/files');
    set('cf_mobile_dashboard', cf + '/dashboard/mobile');
    set('cf_mobile', cf + '/mobile');
    set('cf_mobile_files', cf + '/files');
  }
  document.getElementById('time').textContent = d.updated || '-';
}
window.onload = load;
</script>
</head>
<body>
<div class="container" id="status">
<h2>Remote Access</h2>

<div class="section">
  <p class="label">Web</p>
  <div class="item"><strong>Dashboard</strong><a id="dashboard" href="#">loading...</a><a id="cf_dashboard" class="cf" href="#" style="display:none">-</a></div>
  <div class="item"><strong>Dashboard2</strong><a id="dashboard2" href="#">loading...</a><a id="cf_dashboard2" class="cf" href="#" style="display:none">-</a></div>
  <div class="item"><strong>Terminal</strong><a id="terminal" href="#">loading...</a><a id="cf_terminal" class="cf" href="#" style="display:none">-</a></div>
  <div class="item"><strong>Desktop</strong><a id="desktop" href="#">loading...</a><a id="cf_desktop" class="cf" href="#" style="display:none">-</a></div>
  <div class="item"><strong>Files</strong><a id="files" href="#">loading...</a><a id="cf_files" class="cf" href="#" style="display:none">-</a></div>
</div>

<div class="section">
  <p class="label">Mobile</p>
  <div class="item"><strong>Dashboard</strong><a id="mobile_dashboard" href="#">loading...</a><a id="cf_mobile_dashboard" class="cf" href="#" style="display:none">-</a></div>
  <div class="item"><strong>Terminal</strong><a id="mobile" href="#">loading...</a><a id="cf_mobile" class="cf" href="#" style="display:none">-</a></div>
  <div class="item"><strong>Files</strong><a id="mobile_files" href="#">loading...</a><a id="cf_mobile_files" class="cf" href="#" style="display:none">-</a></div>
</div>

<p class="time">Updated: <span id="time">-</span></p>
</div>
</body>
</html>
