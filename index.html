<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Remote Access</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: -apple-system, sans-serif; color: #333; background: #f0f2f5; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  .container { width: 100%; max-width: 500px; }
  h2 { text-align: center; margin-bottom: 24px; font-size: 22px; }
  .section { background: #fff; border-radius: 14px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .label { font-size: 13px; color: #888; margin-bottom: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
  .link-row { display: flex; gap: 10px; margin-bottom: 10px; }
  .link-row:last-child { margin-bottom: 0; }
  a.btn { display: flex; align-items: center; justify-content: center; flex: 1; text-align: center; padding: 14px 8px; background: #0066cc; color: #fff; text-decoration: none; border-radius: 10px; font-size: 16px; font-weight: 500; transition: background 0.15s; }
  a.btn:active { background: #0052a3; }
  a.btn.cf { background: #e0e0e0; color: #555; font-size: 13px; padding: 14px 8px; flex: 0 0 70px; }
  a.btn.cf:active { background: #ccc; }
  .time { color: #aaa; font-size: 12px; text-align: center; margin-top: 12px; }
</style>
<script>
async function load() {
  try {
    const r = await fetch('url.json?' + Date.now());
    const d = await r.json();
    const base = d.dashboard || '';
    const cf = d.cloudflare || '';
    const links = {
      dashboard: [base, cf],
      dashboard2: [base + '/dashboard2', cf ? cf + '/dashboard2' : ''],
      terminal: [base + '/terminal/', cf ? cf + '/terminal' : ''],
      desktop: [base + '/desktop', cf ? cf + '/desktop' : ''],
      files: [base + '/files', cf ? cf + '/files' : ''],
      mobile_dashboard: [base + '/dashboard/mobile', cf ? cf + '/dashboard/mobile' : ''],
      mobile: [base + '/mobile', cf ? cf + '/mobile' : ''],
      mobile_files: [base + '/files', cf ? cf + '/files' : ''],
    };
    for (const [id, [url, cfUrl]] of Object.entries(links)) {
      const el = document.getElementById(id);
      if (el && url) el.href = url;
      const cel = document.getElementById('cf_' + id);
      if (cel && cfUrl) { cel.href = cfUrl; cel.style.display = 'flex'; }
    }
    document.getElementById('time').textContent = d.updated || '-';
  } catch(e) {
    document.getElementById('status').textContent = 'URL not available';
  }
}
window.onload = load;
</script>
</head>
<body>
<div class="container" id="status">
<h2>Remote Access</h2>

<div class="section">
  <p class="label">Web</p>
  <div class="link-row">
    <a id="dashboard" class="btn" href="#">Dashboard</a>
    <a id="cf_dashboard" class="btn cf" href="#" style="display:none">备用</a>
  </div>
  <div class="link-row">
    <a id="dashboard2" class="btn" href="#">Dashboard2</a>
    <a id="cf_dashboard2" class="btn cf" href="#" style="display:none">备用</a>
  </div>
  <div class="link-row">
    <a id="terminal" class="btn" href="#">Terminal</a>
    <a id="cf_terminal" class="btn cf" href="#" style="display:none">备用</a>
  </div>
  <div class="link-row">
    <a id="desktop" class="btn" href="#">Desktop</a>
    <a id="cf_desktop" class="btn cf" href="#" style="display:none">备用</a>
  </div>
  <div class="link-row">
    <a id="files" class="btn" href="#">Files</a>
    <a id="cf_files" class="btn cf" href="#" style="display:none">备用</a>
  </div>
</div>

<div class="section">
  <p class="label">Mobile</p>
  <div class="link-row">
    <a id="mobile_dashboard" class="btn" href="#">Dashboard</a>
    <a id="cf_mobile_dashboard" class="btn cf" href="#" style="display:none">备用</a>
  </div>
  <div class="link-row">
    <a id="mobile" class="btn" href="#">Terminal</a>
    <a id="cf_mobile" class="btn cf" href="#" style="display:none">备用</a>
  </div>
  <div class="link-row">
    <a id="mobile_files" class="btn" href="#">Files</a>
    <a id="cf_mobile_files" class="btn cf" href="#" style="display:none">备用</a>
  </div>
</div>

<p class="time">Updated: <span id="time">-</span></p>
</div>
</body>
</html>
